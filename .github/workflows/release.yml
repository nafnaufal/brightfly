# Build dan rilis Brightfly untuk Windows.
#
# - Push tag v* (mis. v0.1.0)  -> build + buat GitHub Release otomatis
# - Actions > Release > Run workflow -> build saja, hasilnya di artifact
#
# Tidak ada code signing. SmartScreen bisa menampilkan peringatan pada exe
# yang belum punya reputasi.
# Lisensi proyek: MIT.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Test
        shell: pwsh
        run: cargo test

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package.ps1

      - name: Siapkan aset rilis
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
              throw "Versi tidak ditemukan di Cargo.toml"
          }
          $version = $Matches[1]

          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME tidak cocok dengan versi Cargo $version"
          }

          $stage = Get-ChildItem dist -Directory -Filter "brightfly-$version-win64" |
              Select-Object -First 1
          if (-not $stage) {
              throw "Folder stage tidak ditemukan"
          }

          Copy-Item (Join-Path $stage.FullName "setup.exe") `
              "dist\brightfly-$version-setup.exe" -Force
          Copy-Item (Join-Path $stage.FullName "brightfly.exe") `
              "dist\brightfly-$version.exe" -Force

          $assets = @(
              (Get-ChildItem dist -Filter "brightfly-$version-win64.zip").FullName,
              "dist\brightfly-$version-setup.exe",
              "dist\brightfly-$version.exe"
          )

          $lines = foreach ($asset in $assets) {
              $stream = [System.IO.File]::OpenRead($asset)
              try {
                  $sha = [System.Security.Cryptography.SHA256]::Create()
                  $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant()
              } finally {
                  $stream.Dispose()
              }
              "$hash  $(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: brightfly-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true