# Build and release Brighty for Windows.
#
# - Push a v* tag (e.g. v0.1.1)  -> build + create a GitHub Release
# - Actions > Release > Run workflow -> build only, result is an artifact
#
# No code signing. SmartScreen may warn about exes without reputation.
# Project license: MIT.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }

      - name: Test
        shell: pwsh
        run: cargo test

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package.ps1

      - name: Prepare release assets
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
              throw "Version not found in Cargo.toml"
          }
          $version = $Matches[1]

          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }

          $assets = @(
              "dist\brighty-$version-setup.exe",
              "dist\brighty-$version.exe",
              "dist\brighty-$version-win64.zip"
          )
          foreach ($asset in $assets) {
              if (-not (Test-Path $asset)) {
                  throw "Missing release asset: $asset"
              }
          }

          $lines = foreach ($asset in $assets) {
              $stream = [System.IO.File]::OpenRead($asset)
              try {
                  $sha = [System.Security.Cryptography.SHA256]::Create()
                  $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant()
              } finally {
                  $stream.Dispose()
              }
              "$hash  $(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: brighty-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
