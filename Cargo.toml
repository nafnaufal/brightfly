[package]
name = "brightfly"
version = "0.1.0"
edition = "2024"
description = "Brightness slider untuk monitor eksternal Windows 11"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true